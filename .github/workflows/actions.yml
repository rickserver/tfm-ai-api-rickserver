name: Deploy to VPS

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ '138.68.103.40' }}
        username: ${{ 'ricihi' }}
        key: ${{ '' }}
        script: |
          cd /home/ricihi/repositories/tfm-ai-api-rickserver
          git pull
          docker compose down
          docker-compose up -d --no-deps --build backend